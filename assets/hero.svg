<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#252b35" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowA" cx="85%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#f5b544" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f5b544" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#7ee0c3" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7ee0c3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="30%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d0f12" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8eaed"/>
      <stop offset="55%" stop-color="#e8eaed"/>
      <stop offset="100%" stop-color="#f5b544"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="400" rx="20"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .in   { opacity: 0; animation: rise .8s ease-out forwards; }
    .role { opacity: 0; font-size: 26px; fill: #e8eaed; font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace;
            animation: cycle 12s ease-in-out infinite; }
    .mint { fill: #7ee0c3; }
    .sq   { opacity: 0; animation: pop .5s ease-out forwards; }
    .twinkle { animation: pop .5s ease-out forwards, twinkle 3s ease-in-out infinite; }
    .dot  { animation: pulse 2s ease-out infinite; transform-origin: 88px 318px; }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes rise   { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes cycle  { 0% { opacity: 0; } 4% { opacity: 1; } 21% { opacity: 1; } 25%, 100% { opacity: 0; } }
    @keyframes pop    { from { opacity: 0; } to { opacity: 1; } }
    @keyframes twinkle { 0%, 100% { fill-opacity: 1; } 50% { fill-opacity: .35; } }
    @keyframes pulse  { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(2.6); opacity: 0; } }
    @keyframes blink  { 50% { opacity: 0; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="#0d0f12"/>
    <rect width="1200" height="400" fill="url(#grid)" opacity=".55"/>
    <rect width="1200" height="400" fill="url(#fade)"/>
    <rect width="1200" height="400" fill="url(#glowA)"/>
    <rect width="1200" height="400" fill="url(#glowB)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="20" fill="none" stroke="#252b35"/>

  <text class="mono in" x="64" y="88" font-size="17" fill="#8a93a3">
    <tspan fill="#7ee0c3">vijay@lpu</tspan>:<tspan fill="#f5b544">~$</tspan> ./hello_world<tspan class="caret" fill="#f5b544"> _</tspan>
  </text>

  <text class="sans in" x="60" y="180" font-size="74" font-weight="700" letter-spacing="-2" fill="url(#nameGrad)" style="animation-delay:.25s">Lanjipalli Vijay</text>

  <text class="role" x="64" y="252" style="animation-delay:0s"><tspan class="mint">&gt;</tspan> Engineering Student @ LPU</text>
  <text class="role" x="64" y="252" style="animation-delay:3s"><tspan class="mint">&gt;</tspan> C++ &amp; Python Problem Solver</text>
  <text class="role" x="64" y="252" style="animation-delay:6s"><tspan class="mint">&gt;</tspan> Aspiring Web Developer</text>
  <text class="role" x="64" y="252" style="animation-delay:9s"><tspan class="mint">&gt;</tspan> Learning in public, one commit at a time</text>

